# Query strings may contain short-lived source download tokens.
log_format joyniu_access '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log joyniu_access;
    client_max_body_size 20m;
    client_body_timeout 120s;
    send_timeout 1200s;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        # Resolve again after API container replacement, without restarting web.
        set $api_backend api:8010;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
