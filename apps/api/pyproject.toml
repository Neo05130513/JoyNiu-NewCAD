[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "joyniu-cad-api"
version = "0.2.0"
description = "Auditable FastAPI geometry service for JoyNiu NewCAD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# CadQuery is deliberately optional: the API remains usable in auditable
# tessellated-fallback mode when OCCT wheels are unavailable for a platform.
geometry = [
  "cadquery>=2.4,<3",
]
dwg = [
  "ezdxf>=1.3,<2",
  "matplotlib>=3.8,<4",
  "Pillow>=10,<12",
]
ocr = [
  "Pillow>=10,<12",
  "pytesseract>=0.3.13,<1",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
joyniu-api = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
